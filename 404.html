<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Redirect any 404 to index.html with the original path preserved
      var path = window.location.pathname;
      var redirect = '/kitchen/';
      window.location.href = redirect + '?redirect=' + encodeURIComponent(path + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
